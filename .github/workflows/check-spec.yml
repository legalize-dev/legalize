name: check-spec

# Self-test for check_spec.py, which reads its whole vocabulary out of SPEC.md
# rather than restating it: the worked manifests, the test vectors, the field
# and status and commit-type lists, the notices. This job is what catches the
# document and its checker drifting apart — a reworded sentence the parser no
# longer finds, a section no rule claims, a worked example the resolver
# rejects. See the module docstring for why the split is shaped that way.
#
# It does not clone a country repo and check it against real data; that is
# `python3 check_spec.py <repo_dir>`, run against a checkout — see README.md.
# Doing it here would mean a full clone of a repo like legalize-pt on every
# push, for a script that only needs a handful of files.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 check_spec.py
