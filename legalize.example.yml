# .legalize.yml — the repo manifest required by the Legalize Format Spec v0.4.
# Lives at the root of every country repo. https://github.com/legalize-dev/legalize
#
# It is machine-readable, and it exists for one job: to let a consumer holding
# nothing but a law's identifier build the path to its file. A public URL carries
# an identifier and nothing else, so anything a path depends on must be derivable
# from it — which is why every placeholder is either a value this spec derives
# or a field written into the law's own file.
#
# Generated by the pipeline. Do not edit by hand.

# ─── Which version of the spec this repo conforms to ────────────────────────────
#
# A consumer MUST refuse a repo whose spec_version is newer than the version it
# implements. Reading a newer manifest with older rules yields paths that are
# wrong rather than absent, and a 404 for a law that exists is the hardest
# failure to notice.
spec_version: "0.4"

# ─── ISO 3166-1 alpha-2, and it matches the `country` in every file ─────────────
country: "pt"

# ─── How a file's path is built ─────────────────────────────────────────────────
#
# One entry per group of directories that share a shape. Matching has no ordering
# rules, so an entry cannot be shadowed by where it sits in this file:
#
#   · a directory named literally wins over "*", wherever the two entries appear
#   · at most one entry may use "*", and it is that entry's whole list
#   · a directory matching no entry is an error — a consumer fails, it does not guess
#
# A placeholder is one of two things, and a consumer meeting anything else MUST
# fail rather than guess:
#
#   Derived values — this spec defines these, every repo may use them:
#     {directory}    the file's `jurisdiction` if its frontmatter has one, else its
#                    `country`. Stated in the file, never inferred from its path.
#     {identifier}   the law's `identifier`, verbatim.
#     {id_sha1_2}    first two hex characters, lowercase, of sha1(identifier utf-8).
#                    256 buckets, one level, no deeper.
#
#   Frontmatter fields — any other name is a key of the law's own YAML
#   frontmatter, used verbatim. A field costs nothing to specify because its
#   value is written in the file the path names, so a consumer holding a law's
#   metadata rebuilds the path with no country-specific code. This is how a
#   repo can shard by something legible (e.g. Portugal shards by `{year}`, a
#   plain frontmatter field) without this spec having to anticipate it.
#
# Sharding is recommended for every directory. It never costs more than flat, and
# above a few thousand files it is the difference between a repo that can be
# pushed and one that cannot — see SPEC.md, §Sharding, for the numbers.
layout:
  # Every directory shares one shape here — this repo has no per-directory
  # exception, so there is nothing to enumerate and nothing that goes stale
  # when it gains a jurisdiction. Diário da República, sharded by year (a
  # frontmatter field, not a derived value):
  #   DRE-1998-315-239980  ->  pt/1998/DRE-1998-315-239980.md
  - directories: ["*"]
    path: "{directory}/{year}/{identifier}.md"
